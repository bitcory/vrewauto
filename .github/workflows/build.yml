name: Build Executables

on:
  push:
    branches: [main]
    paths:
      - 'agent.py'
      - 'vrew_cdp.py'

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac executable
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install pyinstaller websockets
          pyinstaller --onefile --name vrew-agent agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: vrew-agent-mac
          path: dist/vrew-agent

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable
        run: |
          python -m venv venv
          venv\Scripts\activate
          pip install pyinstaller websockets
          pyinstaller --onefile --name vrew-agent agent.py
      - uses: actions/upload-artifact@v4
        with:
          name: vrew-agent-windows
          path: dist/vrew-agent.exe

  commit-binaries:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vrew-agent-mac
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: vrew-agent-windows
          path: dist
      - name: Commit binaries
        run: |
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          chmod +x dist/vrew-agent
          git add dist/vrew-agent dist/vrew-agent.exe
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "빌드: 실행파일 업데이트 [skip ci]"
          git push
